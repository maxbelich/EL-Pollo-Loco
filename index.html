<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/imgs/favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/imgs/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/imgs/favicon/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/imgs/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="assets/imgs/favicon/site.webmanifest" />

    <!-- CSS -->
     <link rel="stylesheet" href="style/font.css" />
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/responsive.css" />

    <!-- JavaScript -->
    <script src="classes/drawable-object.class.js" defer></script>
    <script src="classes/sound-manager.class.js" defer></script>
    <script src="classes/movable-object.class.js" defer></script>
    <script src="classes/character.class.js" defer></script>
    <script src="classes/chicken.class.js" defer></script>
    <script src="classes/chicken-small.class.js" defer></script>
    <script src="classes/cloud.class.js" defer></script>
    <script src="classes/status-bar.class.js" defer></script>
    <script src="classes/collision-manager.class.js" defer></script>
    <script src="classes/world.class.js" defer></script>
    <script src="classes/background-objects.class.js" defer></script>
    <script src="classes/keyboard.class.js" defer></script>
    <script src="classes/level.class.js" defer></script>
    <script src="classes/endboss.class.js" defer></script>
    <script src="classes/throwable-object.class.js" defer></script>
    <script src="classes/collectible-object.class.js" defer></script>
    <script src="levels/level1.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body onload="init()">
    <h1>Welcome to EL Pollo Loco!</h1>

    <div id="canvasWrapper">
      <canvas id="canvas" width="720" height="480"></canvas>

      <button id="fullscreenBtn" class="icon-btn" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 9 4 4 9 4"/>
          <polyline points="15 4 20 4 20 9"/>
          <polyline points="20 15 20 20 15 20"/>
          <polyline points="9 20 4 20 4 15"/>
        </svg>
      </button>
      <button id="soundBtn" class="icon-btn">🔊</button>

      <button id="settingsBtn" class="icon-btn" aria-label="Settings"><span>⚙️</span></button>

      <div id="startOverlay">
        <button id="startBtn" class="game-btn">Start</button>
      </div>

      <button id="howToBtn" class="game-btn">How To?</button>

      <div id="howToOverlay">
        <div id="howToBox">
          <button id="howToCloseBtn" class="icon-btn">✕</button>
          <h2>Controls</h2>
          <ul>
            <li>⬅ ➡ / A D - Move</li>
            <li>⬆ / W / SPACE - Jump</li>
            <li>E - Throw Bottle</li>
            <li>Q - Trade 5 Coins for a Bottle</li>
            <li>Jump on chickens to defeat them</li>
            <li>Hit the Endboss with bottles to defeat him</li>
          </ul>
        </div>
      </div>

      <div id="settingsOverlay">
        <div id="settingsBox">
          <button id="settingsCloseBtn" class="icon-btn">✕</button>
          <h2>Settings</h2>
          <label id="volumeLabel">
            Volume:
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" aria-label="Lautstärke">
          </label>
        </div>
      </div>

      <div id="endOverlay">
        <button id="homeBtn" class="game-btn">Home</button>
        <button id="restartBtn" class="game-btn">Restart</button>
      </div>

      <div id="touchControls">
        <div class="touch-group">
          <button id="btnLeft" class="icon-btn touch-btn">⬅</button>
          <button id="btnRight" class="icon-btn touch-btn">➡</button>
        </div>
        <div class="touch-group">
          <button id="btnThrow" class="icon-btn touch-btn">🍾</button>
          <button id="btnJump" class="icon-btn touch-btn">⬆</button>
        </div>
      </div>

      <button id="btnExchange" class="game-btn" aria-label="Trade 5 coins for a bottle">5🪙➜🍾</button>

      <a id="imprintLinkCanvas" href="impressum.html">Imprint</a>
    </div>

    <div id="portraitOverlay">Please turn device to play.</div>

    <footer id="pageFooter">
      <a id="imprintLink" href="impressum.html">Imprint</a>
    </footer>
  </body>
</html>
