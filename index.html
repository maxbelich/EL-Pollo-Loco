<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>

    <!-- CSS -->
     <link rel="stylesheet" href="style/font.css" />
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/responsive.css" />

    <!-- JavaScript -->
    <script src="models/drawable-object.class.js" defer></script>
    <script src="models/sound-manager.class.js" defer></script>
    <script src="models/movable-object.class.js" defer></script>
    <script src="models/character.class.js" defer></script>
    <script src="models/chicken.class.js" defer></script>
    <script src="models/chicken-small.class.js" defer></script>
    <script src="models/cloud.class.js" defer></script>
    <script src="models/status-bar.class.js" defer></script>
    <script src="models/world.class.js" defer></script>
    <script src="models/background-objects.class.js" defer></script>
    <script src="models/keyboard.class.js" defer></script>
    <script src="models/level.class.js" defer></script>
    <script src="models/endboss.class.js" defer></script>
    <script src="models/throwable-object.class.js" defer></script>
    <script src="models/collectible-object.class.js" defer></script>
    <script src="levels/level1.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body onload="init()">
    <h1>Welcome to EL Pollo Loco!</h1>

    <div id="canvasWrapper">
      <canvas id="canvas" width="720" height="480"></canvas>

      <button id="fullscreenBtn" class="icon-btn" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 9 4 4 9 4"/>
          <polyline points="15 4 20 4 20 9"/>
          <polyline points="20 15 20 20 15 20"/>
          <polyline points="9 20 4 20 4 15"/>
        </svg>
      </button>
      <button id="soundBtn" class="icon-btn">🔊</button>

      <button id="settingsBtn" class="icon-btn" aria-label="Settings"><span>⚙️</span></button>

      <div id="startOverlay">
        <button id="startBtn" class="game-btn">Start</button>
      </div>

      <button id="howToBtn" class="game-btn">How To?</button>

      <div id="howToOverlay">
        <div id="howToBox">
          <button id="howToCloseBtn" class="icon-btn">✕</button>
          <h2>Controls</h2>
          <ul>
            <li>⬅ ➡ / A D - Move</li>
            <li>⬆ / W / SPACE - Jump</li>
            <li>E - Throw Bottle</li>
          </ul>
        </div>
      </div>

      <div id="settingsOverlay">
        <div id="settingsBox">
          <button id="settingsCloseBtn" class="icon-btn">✕</button>
          <h2>Settings</h2>
          <label id="volumeLabel">
            Volume:
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" aria-label="Lautstärke">
          </label>
          <a id="imprintLink" href="impressum.html">Imprint</a>
        </div>
      </div>

      <div id="endOverlay">
        <button id="homeBtn" class="game-btn">Home</button>
        <button id="restartBtn" class="game-btn">Restart</button>
      </div>

      <div id="touchControls">
        <div class="touch-group">
          <button id="btnLeft" class="icon-btn touch-btn">⬅</button>
          <button id="btnRight" class="icon-btn touch-btn">➡</button>
        </div>
        <div class="touch-group">
          <button id="btnThrow" class="icon-btn touch-btn">🍾</button>
          <button id="btnJump" class="icon-btn touch-btn">⬆</button>
        </div>
      </div>
    </div>

    <div id="portraitOverlay">Please turn device to play.</div>
  </body>
</html>
